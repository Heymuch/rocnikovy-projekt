name: feicargo
services:
    postgres:
        image: docker.io/library/postgres:18.6
        container_name: postgres
        restart: unless-stopped
        environment:
            POSTGRES_USER: ${POSTGRES_USER:-app}
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
            POSTGRES_DB: ${POSTGRES_DB:-feicargo}
            FLYWAY_USER: ${FLYWAY_USER:-flyway}
            FLYWAY_PASSWORD: ${FLYWAY_PASSWORD:-password}
        ports:
            - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
        volumes:
            - postgres-data:/var/lib/postgresql
            - ./database/init:/docker-entrypoint-initdb.d:ro,z
        healthcheck:
            test: [ "CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}" ]
            interval: 10s
            timeout: 5s
            retries: 5

    pgadmin:
        image: docker.io/dpage/pgadmin4:9.18.0
        container_name: pgadmin
        restart: unless-stopped
        environment:
            PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@example.com}
            PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-password}
            PGADMIN_CONFIG_SERVER_MODE: "False"
            PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
        ports:
            - "127.0.0.1:${PGADMIN_PORT:-5050}:80"
        volumes:
            - pgadmin-data:/var/lib/pgadmin
            - ./database/pgadmin/servers.json:/pgadmin4/servers.json:ro,z
        depends_on:
            postgres:
                condition: service_healthy

volumes:
    postgres-data:
    pgadmin-data:
