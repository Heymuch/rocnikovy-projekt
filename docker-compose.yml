name: feicargo
services:
    postgres:
        image: docker.io/pgrouting/pgrouting:18-3.6-4.0.1 # PostgreSQL 18 + PostGIS + pgRouting (pgr_dijkstra)
        container_name: postgres
        restart: unless-stopped
        environment:
            POSTGRES_USER: ${POSTGRES_USER:-app}
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
            POSTGRES_DB: ${POSTGRES_DB:-feicargo}
            FLYWAY_USER: ${FLYWAY_USER:-flyway}
            FLYWAY_PASSWORD: ${FLYWAY_PASSWORD:-password}
        ports:
            - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
        volumes:
            - postgres-data:/var/lib/postgresql
            - ./database/init:/docker-entrypoint-initdb.d:ro,z
        healthcheck:
            test: [ "CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}" ]
            interval: 10s
            timeout: 5s
            retries: 5

    pgadmin:
        image: docker.io/dpage/pgadmin4:9.18.0
        container_name: pgadmin
        restart: unless-stopped
        environment:
            PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@example.com}
            PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-password}
            PGADMIN_CONFIG_SERVER_MODE: "False"
            PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
        ports:
            - "127.0.0.1:${PGADMIN_PORT:-5050}:80"
        volumes:
            - pgadmin-data:/var/lib/pgadmin
            - ./database/pgadmin/servers.json:/pgadmin4/servers.json:ro,z
        depends_on:
            postgres:
                condition: service_healthy

    keycloak:
        image: quay.io/keycloak/keycloak:26.8.1
        container_name: keycloak
        restart: unless-stopped
        # Dev režim s vestavěnou H2 bez volume: realm se při každém startu znovu
        # naimportuje z ./keycloak, takže zdrojem pravdy je konfigurace v gitu.
        command: [ "start-dev", "--import-realm" ]
        environment:
            KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:-admin}
            KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-password}
            # Pevný hostname => stejný issuer (iss) v JWT pro web i server
            KC_HOSTNAME: http://localhost:${KEYCLOAK_PORT:-8180}
            KC_HEALTH_ENABLED: "true"
        ports:
            - "127.0.0.1:${KEYCLOAK_PORT:-8180}:8080"
        volumes:
            - ./keycloak:/opt/keycloak/data/import:ro,z
        healthcheck:
            test: [ "CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q '\"UP\"' <&3" ]
            interval: 10s
            timeout: 5s
            retries: 12
            start_period: 30s

volumes:
    postgres-data:
    pgadmin-data:
