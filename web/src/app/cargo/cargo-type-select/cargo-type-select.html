<mat-form-field appearance="outline" subscriptSizing="dynamic">
  <mat-label>{{ 'cargoType' | translate }}</mat-label>

  <mat-select [formControl]="control()">
    @for (type of cargoTypes(); track type.id) {
      <mat-option [value]="type.id">
        {{ 'cargoTypes.' + type.name | translate }}
      </mat-option>
    }
  </mat-select>

  @if (control().invalid && (control().touched || control().dirty)) {
    @if (control().errors | validationError; as err) {
      <mat-error>
        {{ err.key | translate: err.params }}
      </mat-error>
    }
  }
</mat-form-field>
