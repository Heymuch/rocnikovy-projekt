<mat-form-field>
  <mat-label>{{ 'cargoType' | translate }}</mat-label>

  <mat-select [formControl]="control()">
    @for (type of cargoTypes(); track type.id) {
      <mat-option [value]="type.id">
        {{ 'cargoTypes.' + type.name | translate }}
      </mat-option>
    }
  </mat-select>

  @let err = control().errors | validationError;
  @if (control().invalid && (control().touched || control().dirty) && err) {
    <mat-error>{{ err.key | translate: err.params }}</mat-error>
  }
</mat-form-field>
