<div class="page-container">
  <h1>{{ 'menu.myOrders' | translate }}</h1>

  <div appPaginatedTable>

    @if (store.isLoading()) {
      <p>{{ 'loading' | translate }}</p>
    } @else if (store.error()) {
      <p>{{ 'loadError' | translate }}</p>
    } @else {
      <app-orders-table
        [orders]="orders()">
      </app-orders-table>
    }

    <mat-paginator
      [length]="store.totalCount()"
      [pageIndex]="store.page()"
      [pageSize]="store.size()"
      [disabled]="store.isLoading()"
      (page)="onPageChange($event)"
      [attr.aria-label]="'pagination.ariaLabel' | translate">
    </mat-paginator>

  </div>
</div>
