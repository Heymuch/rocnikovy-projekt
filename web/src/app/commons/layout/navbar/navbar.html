<mat-toolbar class="app-toolbar-sticky">
  <a routerLink="/" class="logo-link">
    <img src="logo.png" alt="Logo aplikace" class="app-logo">
  </a>

  @if (isAuthenticated) {
    <a mat-button routerLink="/my-orders">{{ 'menu.myOrders' | translate }}</a>
  }
  @if (isCustomer) {
    <a mat-button routerLink="/new-order">{{ 'menu.newOrder' | translate }}</a>
  }
    @if (isAdmin) {
      <a mat-button routerLink="/train-overview">{{ 'menu.trainOverview' | translate }}</a>
    }


  <span class="spacer"></span>

  @if (isAuthenticated && username()) {
    <div class="navbar-user">
      <mat-icon aria-hidden="true">account_circle</mat-icon>
      <span class="navbar-username">{{ username() }}</span>
    </div>
  }

  <button type="button" mat-button (click)="toggleLanguage()">
    <mat-icon>language</mat-icon>
    {{ currentLanguage === 'cs' ? 'EN' : 'CS' }}
  </button>

  @if (isAuthenticated) {
    <button type="button" mat-button class="logout-btn" (click)="logout()">
      <mat-icon class="logout-icon">logout</mat-icon>
      <span class="logout-text">Odhlásit se</span>
    </button>
  } @else {
    <button type="button" mat-button (click)="login()">
      <mat-icon>login</mat-icon>
    </button>
  }
</mat-toolbar>
